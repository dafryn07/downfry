name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libpulse0 libasound2 libxcb-cursor0 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run unit tests (Linux with xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m unittest discover -s tests -p "test_*.py" -v

  build-release:
    name: Build Windows Portable Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: |
          python build_exe.py

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Downfry/* -DestinationPath Downfry-Windows-Portable.zip -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Downfry-Windows-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
